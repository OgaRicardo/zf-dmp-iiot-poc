version: '3.8'
services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb_lab
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=Admin123!
      - DOCKER_INFLUXDB_INIT_ORG=zf_lab
      - DOCKER_INFLUXDB_INIT_BUCKET=cnc
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=ZFLAB_SUPER_TOKEN
    volumes:
      - ./influx-data:/var/lib/influxdb2
    restart: unless-stopped

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: grafana_lab
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=volkovlabs-echarts-panel
    volumes:
      - ./grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped